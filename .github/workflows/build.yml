name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Create project files
        run: |
          cat > settings.gradle <<'EOF0'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'reachdisplay'
          EOF0
          cat > gradle.properties <<'EOF1'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.10
          loader_version=0.18.5
          fabric_version=0.138.4+1.21.10
          mod_version=1.0.0
          maven_group=dev.reachdisplay
          archives_base_name=reachdisplay
          EOF1
          cat > build.gradle <<'EOF2'
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          repositories {}

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF2
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF3'
          {
            "schemaVersion": 1,
            "id": "reachdisplay",
            "version": "${version}",
            "name": "Reach Display",
            "description": "Display-only HUD showing the distance to your target and your last hit. Does not change attack reach.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": { "client": ["dev.reachdisplay.ReachDisplayMod"] },
            "depends": {
              "fabricloader": ">=0.17.0",
              "minecraft": "~1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF3
          mkdir -p src/main/java/dev/reachdisplay
          cat > src/main/java/dev/reachdisplay/ReachConfig.java <<'EOF4'
          package dev.reachdisplay;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;

          /** Config file: .minecraft/config/reachdisplay.json (hot-reloaded about every 2 seconds). */
          public class ReachConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path PATH = FabricLoader.getInstance().getConfigDir().resolve("reachdisplay.json");
              private static long lastModified = -1;

              public static ReachConfig INSTANCE = new ReachConfig();

              public boolean enabled = true;
              public int x = 6;                 // HUD position in pixels from the top-left
              public int y = 6;
              public float scale = 1.0f;        // bar scale (0.5 - 3.0)
              public float backgroundOpacity = 0.5f; // 0.0 - 1.0
              public boolean showLastHit = true;

              // Hex colors (RRGGBB)
              public String colorGreen = "55FF55";       // 0-2
              public String colorYellowGreen = "AAFF00"; // 2-3
              public String colorYellow = "FFFF55";      // 3-3.5
              public String colorOrange = "FFAA00";      // 3.5-4
              public String colorRed = "FF5555";         // 4+

              public int colorFor(double d) {
                  String hex = d < 2.0 ? colorGreen : d < 3.0 ? colorYellowGreen : d < 3.5 ? colorYellow : d < 4.0 ? colorOrange : colorRed;
                  return parse(hex);
              }

              private static int parse(String s) {
                  try { return Integer.parseInt(s.replace("#", "").trim(), 16) & 0xFFFFFF; }
                  catch (Exception e) { return 0xFFFFFF; }
              }

              public static void load() {
                  try {
                      if (!Files.exists(PATH)) { save(); }
                      ReachConfig c = GSON.fromJson(Files.readString(PATH), ReachConfig.class);
                      if (c != null) {
                          c.scale = Math.max(0.5f, Math.min(3.0f, c.scale));
                          c.backgroundOpacity = Math.max(0f, Math.min(1f, c.backgroundOpacity));
                          INSTANCE = c;
                      }
                      lastModified = Files.getLastModifiedTime(PATH).toMillis();
                  } catch (Exception e) {
                      System.err.println("[ReachDisplay] Could not read config: " + e);
                  }
              }

              public static void save() {
                  try { Files.writeString(PATH, GSON.toJson(INSTANCE)); }
                  catch (Exception e) { System.err.println("[ReachDisplay] Could not save config: " + e); }
              }

              public static void reloadIfChanged() {
                  try {
                      if (Files.exists(PATH) && Files.getLastModifiedTime(PATH).toMillis() != lastModified) load();
                  } catch (Exception ignored) {}
              }
          }
          EOF4
          mkdir -p src/main/java/dev/reachdisplay
          cat > src/main/java/dev/reachdisplay/ReachDisplayMod.java <<'EOF5'
          package dev.reachdisplay;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;

          import java.util.Optional;

          /** Display-only: never modifies attack reach, packets or hit detection. */
          public class ReachDisplayMod implements ClientModInitializer {
              private static final double SCAN_RANGE = 8.0;
              private static final double BAR_MAX = 6.0;

              private static double targetDist = -1;  // -1 = no target
              private static double lastHitDist = -1;
              private static int tick = 0;

              @Override
              public void onInitializeClient() {
                  ReachConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      if (++tick % 40 == 0) ReachConfig.reloadIfChanged();
                      targetDist = mc.player == null || mc.level == null ? -1 : computeTargetDistance(mc, mc.player);
                  });

                  AttackEntityCallback.EVENT.register((player, level, hand, entity, hit) -> {
                      if (level.isClientSide() && entity instanceof Player) {
                          Minecraft mc = Minecraft.getInstance();
                          if (mc.player != null) {
                              double d = distanceTo(mc.player, entity.getBoundingBox().inflate(entity.getPickRadius()));
                              if (d >= 0) lastHitDist = d;
                          }
                      }
                      return InteractionResult.PASS; // never cancel or alter the attack
                  });

                  HudElementRegistry.attachElementAfter(
                          VanillaHudElements.MISC_OVERLAYS,
                          ResourceLocation.fromNamespaceAndPath("reachdisplay", "hud"),
                          (graphics, delta) -> render(graphics));
              }

              private static double distanceTo(LocalPlayer p, AABB box) {
                  Vec3 start = p.getEyePosition();
                  Vec3 end = start.add(p.getViewVector(1.0f).scale(SCAN_RANGE));
                  Optional<Vec3> hit = box.clip(start, end);
                  return hit.map(start::distanceTo).orElse(-1.0);
              }

              private static double computeTargetDistance(Minecraft mc, LocalPlayer self) {
                  Vec3 start = self.getEyePosition();
                  Vec3 end = start.add(self.getViewVector(1.0f).scale(SCAN_RANGE));

                  double blockDist = Double.MAX_VALUE;
                  var b = mc.level.clip(new ClipContext(start, end, ClipContext.Block.COLLIDER, ClipContext.Fluid.NONE, self));
                  if (b.getType() != HitResult.Type.MISS) blockDist = b.getLocation().distanceTo(start);

                  double best = -1;
                  for (Player p : mc.level.players()) {
                      if (p == self || p.isSpectator()) continue;
                      double d = distanceTo(self, p.getBoundingBox().inflate(p.getPickRadius()));
                      if (d >= 0 && d < blockDist && (best < 0 || d < best)) best = d;
                  }
                  return best;
              }

              private static int argb(float opacity, int rgb) {
                  return ((int) (opacity * 255) << 24) | (rgb & 0xFFFFFF);
              }

              private static void render(GuiGraphics g) {
                  ReachConfig c = ReachConfig.INSTANCE;
                  Minecraft mc = Minecraft.getInstance();
                  if (!c.enabled || mc.player == null || mc.options.hideGui) return;

                  int w = 130, h = c.showLastHit ? 38 : 26;
                  boolean has = targetDist >= 0;
                  int color = has ? c.colorFor(targetDist) : 0xAAAAAA;

                  g.pose().pushMatrix();
                  g.pose().translate(c.x, c.y);
                  g.pose().scale(c.scale, c.scale);

                  g.fill(0, 0, w, h, argb(c.backgroundOpacity, 0x000000));

                  String line = has ? String.format("REACH %.2f blocks", targetDist) : "REACH -- blocks";
                  g.drawString(mc.font, line, 4, 4, 0xFF000000 | color, true);

                  // bar
                  g.fill(4, 15, w - 4, 20, 0xFF222222);
                  if (has) {
                      int fill = (int) ((w - 8) * Math.min(targetDist / BAR_MAX, 1.0));
                      g.fill(4, 15, 4 + fill, 20, 0xFF000000 | color);
                  }

                  if (c.showLastHit) {
                      String last = lastHitDist >= 0 ? String.format("LAST HIT %.2f blocks", lastHitDist) : "LAST HIT -- blocks";
                      int lc = lastHitDist >= 0 ? c.colorFor(lastHitDist) : 0xAAAAAA;
                      g.drawString(mc.font, last, 4, 25, 0xFF000000 | lc, true);
                  }

                  g.pose().popMatrix();
              }
          }
          EOF5
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: reachdisplay-jar
          path: build/libs/*.jar
